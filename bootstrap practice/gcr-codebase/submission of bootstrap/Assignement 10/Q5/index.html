<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="p-4 text-white">
    <div class="container">
        <h1>My Simple Blog</h1>
        <p>Learning and sharing ideas</p>
    </div>
</header>

<main class="container mt-4">

    <div class="row">

        <!-- Blog 1 -->
        <div class="col-md-6 mb-4">

            <div class="card">

                <div class="card-body">

                    <h2 class="card-title">
                        Learn Web Development
                    </h2>

                    <p class="card-text">
                        Web development is a useful skill.
                        HTML and CSS are the basic technologies
                        used to create websites.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>

        <!-- Blog 2 -->
        <div class="col-md-6 mb-4">

            <div class="card">

                <div class="card-body">

                    <h2 class="card-title">
                        Introduction to Bootstrap
                    </h2>

                    <p class="card-text">
                        Bootstrap helps us create responsive
                        websites easily using ready-made classes.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>

<footer class="text-center p-3 text-white">
    <p>© 2026 My Blog</p>
</footer>

</body>
</html>
