<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container mt-4">

    <h1 class="text-center">Today's Menu</h1>

    <p class="lead text-center">
        Fresh and tasty food for everyone
    </p>

    <!-- Food Image -->
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=1600&h=600&fit=crop&auto=format"
         class="img-fluid w-100"
         alt="Food">

    <p class="text-center">
        Our special food of the day
    </p>

    <!-- Menu Table -->
    <table class="table table-bordered table-striped mt-4">

        <tr>
            <th>Food</th>
            <th>Category</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Pizza</td>
            <td>Main Course</td>
            <td>₹250</td>
        </tr>

        <tr>
            <td>Burger</td>
            <td>Fast Food</td>
            <td>₹150</td>
        </tr>

        <tr>
            <td>Pasta</td>
            <td>Main Course</td>
            <td>₹200</td>
        </tr>

    </table>

    <!-- List Group -->
    <h3>Chef's Specials</h3>

    <ul class="list-group">

        <li class="list-group-item">
            Special Paneer
        </li>

        <li class="list-group-item">
            Cheese Pizza
        </li>

        <li class="list-group-item">
            Chocolate Brownie
        </li>

    </ul>

</main>

</body>
</html>
