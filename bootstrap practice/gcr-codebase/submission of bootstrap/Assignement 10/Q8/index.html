<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container mt-5">

    <h1 class="text-center">Choose Your Plan</h1>

    <p class="text-center">
        Select the plan that is suitable for you.
    </p>

    <div class="row mt-4">

        <!-- Basic -->
        <div class="col-md-4 mb-4">

            <div class="card text-center">

                <div class="card-body">

                    <h2>Basic</h2>

                    <h3>₹199</h3>

                    <p>per month</p>

                    <ul class="list-unstyled">
                        <li>5 Projects</li>
                        <li>Basic Support</li>
                        <li>1 GB Storage</li>
                    </ul>

                    <button class="btn btn-outline-primary">
                        Choose Plan
                    </button>

                </div>

            </div>

        </div>

        <!-- Pro -->
        <div class="col-md-4 mb-4">

            <div class="card text-center bg-primary text-white">

                <div class="card-body">

                    <h2>Pro</h2>

                    <h3>₹499</h3>

                    <p>per month</p>

                    <ul class="list-unstyled">
                        <li>20 Projects</li>
                        <li>Priority Support</li>
                        <li>10 GB Storage</li>
                    </ul>

                    <button class="btn btn-light">
                        Choose Plan
                    </button>

                </div>

            </div>

        </div>

        <!-- Premium -->
        <div class="col-md-4 mb-4">

            <div class="card text-center">

                <div class="card-body">

                    <h2>Premium</h2>

                    <h3>₹799</h3>

                    <p>per month</p>

                    <ul class="list-unstyled">
                        <li>Unlimited Projects</li>
                        <li>24/7 Support</li>
                        <li>50 GB Storage</li>
                    </ul>

                    <button class="btn btn-outline-primary">
                        Choose Plan
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
