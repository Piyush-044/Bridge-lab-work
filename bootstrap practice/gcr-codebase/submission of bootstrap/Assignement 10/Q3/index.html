<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="text-center p-4">
    <h1>My Products</h1>
    <p>Choose your favourite product</p>
</header>

<main class="container">

    <div class="row">

        <!-- Product 1 -->
        <div class="col-12 col-sm-6 col-lg-3 mb-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500&h=300&fit=crop&auto=format"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>
                    <p>₹50,000</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-sm-6 col-lg-3 mb-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&h=300&fit=crop&auto=format"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>
                    <p>₹2,000</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-sm-6 col-lg-3 mb-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&h=300&fit=crop&auto=format"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">
                    <h5 class="card-title">Keyboard</h5>
                    <p>₹1,500</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-12 col-sm-6 col-lg-3 mb-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?w=500&h=300&fit=crop&auto=format"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">
                    <h5 class="card-title">Mouse</h5>
                    <p>₹800</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

    </div>

</main>

</body>
</html>
