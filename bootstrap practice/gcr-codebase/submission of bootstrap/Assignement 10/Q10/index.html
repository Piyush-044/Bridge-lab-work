<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Agency</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="text-center p-4">

    <h1>Dream Travel</h1>

    <p>Explore beautiful places around the world</p>

</header>

<main class="container">

    <!-- Carousel -->
    <div id="travelCarousel"
         class="carousel slide"
         data-bs-ride="carousel">

        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active"
                 data-bs-interval="3000">

                <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1600&h=640&fit=crop&auto=format"
                     class="d-block w-100"
                     alt="Paris">

                <div class="carousel-caption">

                    <h3>Paris</h3>

                    <p>
                        Visit the beautiful city of Paris.
                    </p>

                </div>

            </div>

            <!-- Slide 2 -->
            <div class="carousel-item"
                 data-bs-interval="4000">

                <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=1600&h=640&fit=crop&auto=format"
                     class="d-block w-100"
                     alt="Dubai">

                <div class="carousel-caption">

                    <h3>Dubai</h3>

                    <p>
                        Experience the modern city of Dubai.
                    </p>

                </div>

            </div>

            <!-- Slide 3 -->
            <div class="carousel-item"
                 data-bs-interval="5000">

                <img src="https://images.unsplash.com/photo-1531973576160-7125cd663d86?w=1600&h=640&fit=crop&auto=format"
                     class="d-block w-100"
                     alt="Switzerland">

                <div class="carousel-caption">

                    <h3>Switzerland</h3>

                    <p>
                        Enjoy the beautiful mountains.
                    </p>

                </div>

            </div>

        </div>

        <!-- Previous Button -->
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <!-- Next Button -->
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>


    <!-- Booking Progress -->
    <div class="mt-4">

        <h4>Booking Completion</h4>

        <div class="progress">

            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 style="width: 70%;">

                70%

            </div>

        </div>

    </div>

</main>

<footer class="text-center bg-dark text-white p-4 mt-5">

    <h5>Contact Us</h5>

    <p>Email: travel@example.com</p>

    <p>Phone: +91 9876543210</p>

</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
