<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bg-dark text-white text-center mt-4 p-5">

    <h1>Piyush Yadav</h1>

    <p class="lead">
        Computer Science Student
    </p>

</header>

<main class="container text-center mt-4">

    <!-- Profile Image -->
    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=360&h=360&fit=crop&auto=format"
         class="img-fluid rounded-circle"
         alt="Profile Image">

    <h2 class="mt-3">About Me</h2>

    <p>
        I am a Computer Science student interested in web development
        and data science.
    </p>

    <!-- Buttons -->
    <button class="btn btn-primary m-2">
        Hire Me
    </button>

    <button class="btn btn-secondary m-2">
        Download CV
    </button>

    <!-- Contact Form -->
    <div class="mt-4">

        <h3>Contact Me</h3>

        <input type="text"
               class="form-control mb-3"
               placeholder="Your Name">

        <input type="email"
               class="form-control mb-3"
               placeholder="Your Email">

        <textarea class="form-control mb-3"
                  placeholder="Your Message"></textarea>

        <button class="btn btn-success">
            Send Message
        </button>

    </div>

</main>

</body>
</html>
