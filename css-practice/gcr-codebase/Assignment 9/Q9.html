<!DOCTYPE html>
<html lang="en">
<head>
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="Q9.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Responsive Design Principles</h1>

    <main class="principles">
        <section>
            <h2>Fluid Layouts</h2>
            <p>Layouts adjust according to available screen width.</p>
            <code>width: 100%;</code>
        </section>

        <section>
            <h2>Flexible Media</h2>
            <p>Images resize to fit their containers.</p>
            <code>max-width: 100%;</code>
        </section>

        <section>
            <h2>Breakpoints</h2>
            <p>Change the layout at specific screen widths.</p>
            <code>@media (max-width: 600px)</code>
        </section>
    </main>
</body>
</html>
