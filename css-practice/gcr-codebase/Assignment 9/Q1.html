<!DOCTYPE html>
<html lang="en">
<head>
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="Q1.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Image Filter Gallery</h1>

    <div class="gallery">
        <div><img class="blur" src="https://picsum.photos/id/10/300/200"><p>Blur</p></div>
        <div><img class="gray" src="https://picsum.photos/id/20/300/200"><p>Grayscale</p></div>
        <div><img class="sepia" src="https://picsum.photos/id/30/300/200"><p>Sepia</p></div>
        <div><img class="bright" src="https://picsum.photos/id/40/300/200"><p>Brightness</p></div>
        <div><img class="contrast" src="https://picsum.photos/id/50/300/200"><p>Contrast</p></div>
        <div><img class="hue" src="https://picsum.photos/id/60/300/200"><p>Hue Rotate</p></div>
    </div>
</body>
</html>
