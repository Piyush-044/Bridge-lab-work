<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            text-align: center;
            padding: 20px;
        }

        /* Box model ko center karna */
        .demo {
            display: flex;
            justify-content: center;
            margin: 40px;
        }

        /* Margin layer */
        .margin {
            background-color: orange;
            padding: 30px;
        }

        /* Border layer */
        .border {
            background-color: lightblue;
            border: 10px solid black;
        }

        /* Padding layer */
        .padding {
            background-color: lightgreen;
            padding: 30px;
        }

        /* Content */
        .content {
            background-color: pink;
            padding: 30px;
            font-weight: bold;
        }

        /* Comparison */
        .comparison {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .example {
            background-color: white;
            padding: 20px;
        }

        /* Default box sizing */
        .content-box {
            box-sizing: content-box;

            width: 200px;
            padding: 20px;
            border: 5px solid blue;
        }

        /* Border-box */
        .border-box {
            box-sizing: border-box;

            width: 200px;
            padding: 20px;
            border: 5px solid green;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <p>
        Content → Padding → Border → Margin
    </p>

    <!-- Box Model demonstration -->
    <div class="demo">

        <div class="margin">

            <div class="border">

                <div class="padding">

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

    </div>

    <h2>Box Sizing Comparison</h2>

    <div class="comparison">

        <div class="example">
            <h3>Content Box</h3>

            <div class="content-box">
                Width: 200px
            </div>
        </div>

        <div class="example">
            <h3>Border Box</h3>

            <div class="border-box">
                Width: 200px
            </div>
        </div>

    </div>

</body>
</html>
