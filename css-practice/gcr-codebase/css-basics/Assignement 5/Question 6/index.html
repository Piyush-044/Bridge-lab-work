<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Some beautiful places</p>
    </header>


    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <div class="photo">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
                <div class="caption">Beautiful Mountain</div>
            </div>


            <!-- Image 2 -->
            <div class="photo">
                <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
                <div class="caption">Peaceful Nature</div>
            </div>


            <!-- Image 3 -->
            <div class="photo">
                <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
                <div class="caption">Cute Animal</div>
            </div>


            <!-- Image 4 -->
            <div class="photo">
                <img src="https://picsum.photos/id/1035/600/400" alt="Lake">
                <div class="caption">Beautiful Lake</div>
            </div>


            <!-- Image 5 -->
            <div class="photo">
                <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
                <div class="caption">Green Forest</div>
            </div>


            <!-- Image 6 -->
            <div class="photo">
                <img src="https://picsum.photos/id/1050/600/400" alt="Beach">
                <div class="caption">Sunny Beach</div>
            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
