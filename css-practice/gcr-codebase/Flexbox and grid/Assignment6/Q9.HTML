<!DOCTYPE html>
<html>
<head>
    <title>Card Flip Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: lightgray;
        }

        /* Card ki perspective */
        .card-container {
            width: 300px;
            height: 400px;

            perspective: 1000px;
        }

        /* Actual card */
        .card {
            width: 100%;
            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            transition: transform 0.8s;
        }

        /* Hover par 180 degree flip */
        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        /* Front and back */
        .front,
        .back {
            position: absolute;

            width: 100%;
            height: 100%;

            backface-visibility: hidden;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 15px;
        }

        /* Front */
        .front {
            background-color: steelblue;
            color: white;
        }

        .front img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        /* Back */
        .back {
            background-color: white;
            color: black;

            transform: rotateY(180deg);

            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="card-container">

        <div class="card">

            <!-- Front -->
            <div class="front">

                <img src="https://via.placeholder.com/150"
                     alt="Profile">

                <h1>My Profile</h1>

            </div>

            <!-- Back -->
            <div class="back">

                <h2>About Me</h2>

                <p>
                    I am learning HTML and CSS.
                    This is my card flip animation.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
