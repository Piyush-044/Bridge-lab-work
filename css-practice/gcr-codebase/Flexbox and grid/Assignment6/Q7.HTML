<!DOCTYPE html>
<html>
<head>
    <title>Loading Animation</title>

    <style>
        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;

            background-color: black;
        }

        /* Loading container */
        .loading {
            display: flex;
            gap: 10px;
        }

        /* Circles */
        .circle {
            width: 20px;
            height: 20px;

            background-color: white;

            border-radius: 50%;

            animation: move 1s infinite;
        }

        /* Animation */
        @keyframes move {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Different animation delays */
        .circle:nth-child(2) {
            animation-delay: 0.2s;
        }

        .circle:nth-child(3) {
            animation-delay: 0.4s;
        }
    </style>
</head>

<body>

    <div class="loading">

        <div class="circle"></div>

        <div class="circle"></div>

        <div class="circle"></div>

    </div>

</body>
</html>
