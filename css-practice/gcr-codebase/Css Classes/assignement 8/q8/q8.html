<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing Comparison</title>

    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <h1>Box-Sizing Comparison</h1>

    <main class="container">

        <div class="box content-box">

            <h2>Content Box</h2>

            <p>
                Padding and border are added
                outside the given width.
            </p>

        </div>

        <div class="box border-box">

            <h2>Border Box</h2>

            <p>
                Padding and border are included
                inside the given width.
            </p>

        </div>

    </main>

</body>
</html>
