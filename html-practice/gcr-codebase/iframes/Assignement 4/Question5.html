<!DOCTYPE html>
<html>
<head>

    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Tells who created the page -->
    <meta name="author" content="Rahul">

    <!-- Makes page adjust according to screen size -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title of the webpage -->
    <title>Complete Head Example</title>

</head>
<body>

    <h1>HTML Encoding Example</h1>

    <p>Hello, this is English text.</p>
    <p>यह हिंदी में लिखा गया है।</p>
    <p>これは日本語の文章です。</p>

</body>
</html>
