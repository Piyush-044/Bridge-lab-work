<!DOCTYPE html>
<html>
<head>

    <!-- Title of the webpage -->
    <title>Important Head Elements</title>

    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Gives a short description of the webpage -->
    <meta name="description" content="This page shows important HTML head elements.">

    <!-- Tells the author of the webpage -->
    <meta name="author" content="Rahul">

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Used to connect external resources like favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- CSS can be written inside style tag -->
    <style>
    </style>

    <!-- JavaScript can be written inside script tag -->
    <script>
    </script>

</head>
<body>

    <h1>Important Head Elements</h1>

    <p>This page contains different elements used inside the head section.</p>

</body>
</html>
